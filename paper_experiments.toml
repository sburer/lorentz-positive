source_table = "outputs/tables/noxious_results_fragment.tex"
notes = "Unit-sphere noxious formulation. noxious_regular_large.csv holds m=20,24,32, which the prose quotes (Full SEP 1.001735) but the table omits; the table maker writes them as a comment after the table."

