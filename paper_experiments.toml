source_seeds = "outputs/raw/maxdist_large_selected_seeds.csv"
source_table = "outputs/tables/large_instance_results_fragment.tex"
notes = "Ten retained instances per dimension. Only Lazy KRON and Lazy SEP are run."

[[tables]]
