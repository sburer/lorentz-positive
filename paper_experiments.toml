# Paper computational inventory for the Lorentz manuscript (paper/Lorentz.tex
# in the parent repository).
#
# This file is the source-of-truth map between the manuscript and the
# reproduction code.  It intentionally records what the paper needs, not every
# exploratory experiment in the repository.  All paths are relative to this
# directory, so the directory works the same whether it is a subfolder of the
# paper repository or a repository of its own.  The manuscript path is the
# one exception: it points outside this directory, and the manuscript checks
# are skipped (not failed) when it is absent.
manuscript = "../paper/Lorentz.tex"
paper_code_root = "."
output_root = "outputs"
table_count = 11

# Environment that produced the committed raw CSVs (timings depend on it;
# bounds and gaps should reproduce on any machine to solver tolerance).
[environment]
machine = "Mac mini, Apple M4, 10 cores, 16 GB memory"
os = "macOS 26.5.2"
python = "3.14.6"
numpy = "2.5.1"
scipy = "1.18.0"
mosek = "11.2.2 through Python Fusion"
gurobi = "13.0.2 through gurobipy"
thread_policy = "solver defaults unless the manuscript explicitly states otherwise"

[global_tolerances]
tight_relative_gap = 1.0e-5
lazy_violation_tolerance = 1.0e-7
dual_lop_trs_bisection_tolerance = 1.0e-6
rank_one_screen_ratio = 1.0e4

[outputs]
raw = "outputs/raw"
summary = "outputs/summary"
tables = "outputs/tables"
examples = "outputs/examples"

[external]
ballconstraints_repo = "https://github.com/sburer/ballconstraints"
ballconstraints_submodule = "external/ballconstraints"
ballconstraints_commit = "9304c25cd6f917de82bfc68038757fa6d3509720"
ballconstraints_used_for = "212 TTRS instances (tab:TTRS_results, tab:TTRS_diagnostics), the beta relaxation in example ttrs_beta_failure_eq_24, and the conic standard-form builder behind the noxious-facility models"

[[tables]]
label = "tab:bilinear_times"
section = "3.1"
family = "bilinear"
caption = "Median wall-clock times for bilinear instances."
rows = ["2x2", "4x4", "6x6", "8x8", "10x10", "15x15", "20x20", "4x8", "8x12", "10x20", "15x20", "15x25"]
columns = ["n x m", "cases", "Shor", "Full SEP", "Lazy SEP", "LOP/TRS", "Gurobi", "G_opt"]
source_raw = "outputs/raw/bilinear_raw.csv"
source_seeds = "outputs/raw/bilinear_selected_seeds.csv"
source_table = "outputs/tables/bilinear_results_fragment.tex"
notes = "Ten retained instances per row. Rectangular rows use n < m. Gurobi time limit is max(5, 3*t_max), where t_max is the maximum conic time on that instance."

[[tables]]
label = "tab:bilinear_diagnostics"
section = "3.1"
family = "bilinear"
caption = "Additional diagnostics for bilinear instances."
rows = ["2x2", "4x4", "6x6", "8x8", "10x10", "15x15", "20x20", "4x8", "8x12", "10x20", "15x20", "15x25"]
columns = ["n x m", "Shor max gap", "Conic max diff", "Lazy SEP rounds", "Lazy SEP cuts", "Lazy SEP max skew", "LOP/TRS oracles", "LOP/TRS max gap"]
source_raw = "outputs/raw/bilinear_raw.csv"
source_seeds = "outputs/raw/bilinear_selected_seeds.csv"
source_table = "outputs/tables/bilinear_results_fragment.tex"
notes = "Uses the same 120 instances as tab:bilinear_times. Shor screening requires relative Shor gap greater than 0.01. Lazy SEP uses coordinate skew-skew cuts."

[[tables]]
label = "tab:maxdist_times"
section = "4.1"
family = "max_distance"
caption = "Median wall-clock times for max-distance instances."
rows = ["2", "4", "6", "8", "10", "15"]
columns = ["n", "cases", "Shor", "KRON", "Lazy KRON", "Full SEP", "Lazy SEP", "Gurobi", "Gurobi opt"]
source_raw = "outputs/raw/maxdist_raw.csv"
source_seeds = "outputs/raw/maxdist_selected_seeds.csv"
source_table = "outputs/tables/maxdist_results_fragment.tex"
notes = "Ten retained instances per dimension. Candidate ellipsoid pairs are retained only when Shor is not certified rank one by the rank/face screen."

[[tables]]
label = "tab:maxdist_diagnostics"
section = "4.1"
family = "max_distance"
caption = "Bound quality and diagnostics for max-distance instances."
rows = ["2", "4", "6", "8", "10", "15"]
columns = ["n", "Shor tight", "Shor max gap", "KRON tight", "KRON max gap", "SEP tight", "SEP max gap", "Lazy KRON rounds", "Lazy KRON cuts", "Lazy KRON max viol.", "Lazy SEP rounds", "Lazy SEP cuts", "Lazy SEP max skew"]
source_raw = "outputs/raw/maxdist_raw.csv"
source_seeds = "outputs/raw/maxdist_selected_seeds.csv"
source_table = "outputs/tables/maxdist_results_fragment.tex"
notes = "Each conic method uses its own first-column recovered feasible point for the upper bound. Tight means relative bound gap <= 1e-5."

[[tables]]
label = "tab:maxdist_larger"
