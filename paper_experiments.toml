[[examples]]
id = "ttrs_beta_failure_eq_24"
section = "4.2"
label = "eq:ttrs_counterexample_data"
description = "Two-dimensional TTRS counterexample where Shor and SEP are not exact and the beta relaxation from Burer (2025) also fails to close the gap."
required_values = [
  "z_shor = -0.768293943469",
  "z_sep = -0.632844508289",
  "z_star = -0.546797627007",
  "z_beta = -0.550899217259",
  "SEP relative gap = 15.74 percent",
  "beta relative gap = 0.75 percent"
]
source_script = "verify_ttrs_sep_beta_counterexample.py"
source_note = "outputs/examples/ttrs_sep_beta_counterexample_note.tex"
source_raw = "outputs/examples/ttrs_sep_beta_counterexample_verification.txt"
external_dependency = "ballconstraints submodule (beta relaxation SDP builder)"
notes = "Named reproducibility example at the end of Section 4.2; equation (24) in the current draft numbering. reproduce.py rewrites source_raw from source_script."

[[examples]]
id = "noxious_targeted_four_point"
section = "4.3"
label = "eq:targeted"
description = "Four-point noxious-facility instance where Full SEP nearly closes the gap compared with Shor, RLT, and KRON."
required_values = [
  "Shor = 1.2174074784",
  "RLT = 1.0382899391",
  "KRON = 0.8379375081",
  "Full SEP = 0.7257975088",
